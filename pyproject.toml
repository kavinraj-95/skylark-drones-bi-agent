[project]
name = "skylark-bi"
version = "0.1.0"
description = "Business intelligence agent over monday.com Work Orders and Deals boards"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.41.1",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "respx==0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skylark_bi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
# The package lives at the repo root rather than under src/ so that Streamlit
# Community Cloud - which runs from the repo root - can import it with no path
# manipulation. Deployment reliability beats layout purity for a hosted app.
package = true
